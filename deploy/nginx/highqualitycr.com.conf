upstream highquality_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Only send "Connection: upgrade" upstream on an actual websocket handshake.
# Hardcoding it unconditionally poisons the keepalive pool to upstream for
# every plain HTTP request (including Socket.IO's own polling fallback),
# which is what caused the flaky "sin conexion" websocket status.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name highqualitycr.com www.highqualitycr.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name highqualitycr.com www.highqualitycr.com;

    ssl_certificate     /etc/letsencrypt/live/highqualitycr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/highqualitycr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://highquality_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# stage.highqualitycr.com — same app, own cert (mirrors the block above).
# NOTE: the live server already has a working server block for this subdomain
# with its own Let's Encrypt cert (verified externally); this repo file was
# missing it (config drift). Apply the same $connection_upgrade fix to that
# live block, since it likely still has the hardcoded "upgrade" bug too.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stage.highqualitycr.com;

    ssl_certificate     /etc/letsencrypt/live/stage.highqualitycr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.highqualitycr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://highquality_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
